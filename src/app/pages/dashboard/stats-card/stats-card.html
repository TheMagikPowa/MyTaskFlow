<div class="stats-card">
  <div class="card-header">
    <span class="card-title">{{ title() }}</span>

    <div class="card-icon">
      <span>{{ icon() }}</span>
    </div>
  </div>

  <div class="card-value">
    {{ value() }}
  </div>

  <div class="card-description">
    {{ description() }}
  </div>
</div>
